plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.darkblade.mbe.electrics'
version = '1.0.0'

dependencies {
    compileOnly 'com.github.Parallax-Development:MultiBlockEngine:dev-SNAPSHOT'
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly "org.jetbrains:annotations:24.0.0"
    compileOnly 'dev.darkblade.mbe.wiring:mbe-wiring:1.1.0'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('addon.yml') {
        expand props
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

publishing {
    publications {
        mbeElectrics(MavenPublication) {
            artifactId = 'mbe-electrics'
            from components.java
        }
    }
}
