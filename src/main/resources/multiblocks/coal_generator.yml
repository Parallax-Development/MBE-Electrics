id: "mbe-electrics:coal_generator"
version: "1.0.0"
display-name: "&6Coal Generator"
assembly-trigger: WRENCH_USE
persistent: true
tick-interval: 20
variables:
  fuel_ticks: 0
controller: "minecraft:blast_furnace[facing=north,lit=false]"
pattern:
  - offset: [-1, -1, 0]
    match: "minecraft:brick_wall[east=tall,north=none,south=tall,up=true,waterlogged=false,west=none]"
  - offset: [-1, -1, 1]
    match: BRICKS
  - offset: [-1, -1, 2]
    match: "minecraft:brick_wall[east=tall,north=tall,south=none,up=true,waterlogged=false,west=none]"
  - offset: [0, -1, 0]
    match: BRICKS
  - offset: [0, -1, 1]
    match: BRICKS
  - offset: [0, -1, 2]
    match: BRICKS
  - offset: [1, -1, 0]
    match: "minecraft:brick_wall[east=none,north=none,south=tall,up=true,waterlogged=false,west=tall]"
  - offset: [1, -1, 1]
    match: BRICKS
  - offset: [1, -1, 2]
    match: "minecraft:brick_wall[east=none,north=tall,south=none,up=true,waterlogged=false,west=tall]"
  - offset: [-1, 0, 0]
    match: "minecraft:brick_wall[east=tall,north=none,south=tall,up=true,waterlogged=false,west=none]"
  - offset: [-1, 0, 1]
    match: "minecraft:target[power=0]"
  - offset: [-1, 0, 2]
    match: "minecraft:brick_wall[east=tall,north=tall,south=none,up=true,waterlogged=false,west=none]"
  - offset: [0, 0, 2]
    match: "minecraft:blast_furnace[facing=south,lit=false]"
  - offset: [1, 0, 0]
    match: "minecraft:brick_wall[east=none,north=none,south=tall,up=true,waterlogged=false,west=tall]"
  - offset: [1, 0, 1]
    match: "minecraft:target[power=0]"
  - offset: [1, 0, 2]
    match: "minecraft:brick_wall[east=none,north=tall,south=none,up=true,waterlogged=false,west=tall]"
  - offset: [-1, 1, 0]
    match: BRICKS
  - offset: [-1, 1, 1]
    match: BRICKS
  - offset: [-1, 1, 2]
    match: BRICKS
  - offset: [0, 1, 0]
    match: BRICKS
  - offset: [0, 1, 1]
    match: BRICKS
  - offset: [0, 1, 2]
    match: BRICKS
  - offset: [1, 1, 0]
    match: BRICKS
  - offset: [1, 1, 1]
    match: BRICKS
  - offset: [1, 1, 2]
    match: BRICKS

ports:
  port_out_1:
    direction: output
    type: energy
    block: [-1, 1, 1]
    capabilities: [emit]
  port_out_2:
    direction: output
    type: energy
    block: [1, 1, 1]
    capabilities: [emit]